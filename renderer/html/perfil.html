<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeControl · Perfiles</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../estilos.css">
</head>
<body>
<div class="contenedor-app">
  <div class="tarjeta-cristal contenedor-perfiles">
    <div class="icono-logo">
      <i class="fas fa-users"></i>
    </div>
    <h1>¿Quién está usando FreeControl?</h1>
    <div class="eslogan">Selecciona un perfil o crea uno nuevo</div>

    <div id="contenedorPerfiles" class="cuadricula-perfiles">
      <!-- Los perfiles se cargarán dinámicamente con JS -->
    </div>

    <button id="botonCrearPerfil" class="boton-secundario"><i class="fas fa-plus"></i> Crear perfil</button>
    <p id="mensajeInfo" class="mensaje-info"></p>
  </div>
</div>

<!-- Modal para crear perfil -->
<div id="modalCrearPerfil" class="modal-crear">
  <div class="contenido-modal">
    <h2><i class="fas fa-id-card"></i> Nuevo perfil</h2>
    <input type="text" id="entradaNombrePerfil" class="campo-entrada" placeholder="Nombre del perfil (ej: Trabajo, Casa)">
    <div class="botones-modal">
      <button id="botonGuardarPerfil" class="boton-primario">Guardar</button>
      <button id="botonCancelarModal" class="boton-secundario">Cancelar</button>
    </div>
  </div>
</div>

<script src="../js/perfil.js"></script>
</body>
</html>
