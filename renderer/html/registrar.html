<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeControl · Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../estilos.css">
</head>
<body>
<div class="contenedor-app">
  <div class="tarjeta-registro tarjeta-cristal">
    <div class="icono-logo">
      <i class="fas fa-user-plus"></i>
    </div>
    <h1>Crear cuenta</h1>
    <div class="eslogan">Únete a FreeControl y olvida el teclado</div>

    <div class="grupo-input">
      <label><i class="fas fa-user"></i> Usuario</label>
      <input type="text" id="nombreUsuario" class="campo-entrada" placeholder="Ej: sergio_lopez">
    </div>
    <div class="grupo-input">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="correo" class="campo-entrada" placeholder="tu@email.com">
    </div>
    <div class="grupo-input">
      <label><i class="fas fa-lock"></i> Contraseña</label>
      <input type="password" id="contrasena" class="campo-entrada" placeholder="Mínimo 6 caracteres">
    </div>

    <button onclick="register()" class="boton-primario"><i class="fas fa-check-circle"></i> Crear cuenta</button>

    <p id="mensajeInfo" class="mensaje-info"></p>
    <p>¿Ya tienes cuenta? <a href="login.html" class="enlace-texto">Inicia sesión</a></p>
  </div>
</div>
<script src="../js/registrar.js"></script>
</body>
</html>
