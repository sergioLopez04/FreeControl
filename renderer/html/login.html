  <!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeControl · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../estilos.css">
  </head>
  <body>
  <div class="app-container">
    <div class="login-card glass-card">
      <div class="logo-icon">
        <i class="fas fa-hand-peace"></i> <i class="fas fa-microphone-alt"></i>
      </div>
      <h1>FreeControl</h1>
      <div class="tagline">Controla tu PC con gestos, sonidos y movimientos</div>

      <div class="input-group">
        <label><i class="fas fa-envelope"></i> Email</label>
        <input type="email" id="email" class="input-field" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Contraseña</label>
        <input type="password" id="password" class="input-field" placeholder="••••••">
      </div>

      <!-- ✅ onclick restaurado -->
      <button onclick="login()" class="btn-primary"><i class="fas fa-arrow-right-to-bracket"></i> Entrar</button>

      <p id="error" class="error-message"></p>
      <p>¿No tienes cuenta? <a href="registrar.html" class="text-link">Regístrate</a></p>
      <div>✨ Sin teclado ni ratón · Accesibilidad e innovación</div>
    </div>
  </div>
  <script src="../js/login.js"></script>
  </body>
  </html>
