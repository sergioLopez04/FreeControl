<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>FreeControl · Control por gestos y sonidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="contenedor-app">
  <div id="seccionDashboard" class="contenedor-dashboard">
    <div class="tarjeta-cristal">
      <div class="cabecera-dashboard">
        <div class="texto-bienvenida">
          <h2 id="saludoUsuario">Perfil: <span id="textoNombreUsuario">Usuario</span></h2>
          <p><i class="fas fa-magic"></i> Interacción manos libres · Gestos + voz</p>
        </div>
        <button id="botonCambiarPerfil" class="boton-cerrar-sesion"><i class="fas fa-sign-out-alt"></i> Cambiar Perfil</button>
        <button id="botonCerrarSesion" class="boton-cerrar-sesion"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
      </div>

      <div class="cuadricula-acciones">
        <div class="tarjeta-accion" id="botonConfigurarGestos">
          <i class="fas fa-sliders-h"></i>
          <h3>Configurar gestos</h3>
          <p>Asocia movimientos de mano, cabeza o sonidos a acciones del sistema</p>
        </div>

        <div class="tarjeta-accion tarjeta-info" id="tarjetaResumenPerfil">
          <i class="fas fa-chart-pie"></i>
          <h3>Resumen del Perfil</h3>
          <div class="lista-estadisticas-mini">
            <p><i class="fas fa-hand-paper"></i> Gestos: <strong id="contadorGestos">0</strong></p>
            <p><i class="fas fa-microphone"></i> Sonidos: <strong id="contadorSonidos">0</strong></p>
          </div>
        </div>
      </div>

      <div class="division-info">
        <div class="panel-info">
          <h4><i class="fas fa-hand-peace"></i> Gestos & Comandos</h4>
          <ul id="listaGestosAsignados" class="lista-gestos"></ul>
        </div>
        <div class="panel-info">
          <h4><i class="fas fa-microphone-alt"></i> Comandos de Voz</h4>
          <ul id="listaSonidosAsignados" class="lista-gestos"></ul> 
        </div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
